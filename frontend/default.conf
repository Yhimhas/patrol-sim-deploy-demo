server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location = /api/health {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
